[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "water-placement-rl"
version = "0.1.0"
description = "Deep reinforcement learning agents (DQN, TD3, PPO) for placing water molecules into protein electron-density maps"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tonnar Castellano" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "gymnasium>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
structures = ["gemmi>=0.6"]          # needed only to load real PDB / CCP4 files
wandb = ["wandb>=0.16"]
dev = ["pytest>=7", "gemmi>=0.6"]

[project.scripts]
wprl-train = "wprl.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905"]
